<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terax AI</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("terax-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.backgroundColor =
            resolved === "dark" ? "#141414" : "#ffffff";
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="ai-root"></div>
    <script>
      (function () {
        function showFailure(message) {
          var root = document.getElementById("ai-root");
          if (!root) return;
          root.style.cssText =
            "padding:24px;font:12px/1.6 system-ui,sans-serif;color:#b42318;white-space:pre-wrap";
          root.textContent = "AI window failed to start:\n" + message;
        }
        window.addEventListener("error", function (event) {
          showFailure(event.message || String(event.error || "unknown error"));
        });
        window.addEventListener("unhandledrejection", function (event) {
          showFailure(String(event.reason || "unknown rejection"));
        });
      })();
    </script>
    <script type="module" src="/src/ai/main.tsx"></script>
  </body>
</html>
