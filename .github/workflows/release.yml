name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check latest release tag
        id: latest
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $remoteTags = git ls-remote --tags origin "refs/tags/v*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $latestTag = $remoteTags |
            ForEach-Object {
              $ref = ($_ -split '\s+', 2)[1]
              if ($ref -match '^refs/tags/(v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
                $Matches[1]
              }
            } |
            Sort-Object -Property { [version]$_.Substring(1) } -Descending |
            Select-Object -First 1

          if (-not $latestTag) {
            throw "No stable vX.Y.Z release tag was found on origin"
          }

          $isLatest = if ($env:TAG_NAME -eq $latestTag) { "true" } else { "false" }
          "latest-tag=$latestTag" >> $env:GITHUB_OUTPUT
          "is-latest=$isLatest" >> $env:GITHUB_OUTPUT

          if ($isLatest -eq "false") {
            Write-Host "::notice::Skipping $env:TAG_NAME; the latest release tag is $latestTag"
          }

      - uses: pnpm/action-setup@v6
        if: steps.latest.outputs.is-latest == 'true'

      - uses: actions/setup-node@v7
        if: steps.latest.outputs.is-latest == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release version
        if: steps.latest.outputs.is-latest == 'true'
        run: node scripts/release-version.mjs --check "${{ github.ref_name }}"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.latest.outputs.is-latest == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.latest.outputs.is-latest == 'true'
        with:
          workspaces: ./src-tauri -> target
          key: windows

      - name: Install frontend dependencies
        if: steps.latest.outputs.is-latest == 'true'
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        if: steps.latest.outputs.is-latest == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Terax ${{ github.ref_name }}"
          releaseBody: "下载下方的 Windows 安装包。应用支持自动更新。"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Generate release notes
        if: steps.latest.outputs.is-latest == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $notes = gh api --method POST "repos/$env:GH_REPO/releases/generate-notes" -f "tag_name=$env:TAG_NAME" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $body = @"
          ## 下载与安装

          下载下方的 Windows 安装包。应用支持自动更新。

          $($notes.body)
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $body, [System.Text.UTF8Encoding]::new($false))
          gh release edit "$env:TAG_NAME" --repo "$env:GH_REPO" --notes-file "$notesPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
