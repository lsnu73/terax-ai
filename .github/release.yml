changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "## 新功能"
      labels:
        - feature
        - enhancement
        - feat
    - title: "## 问题修复"
      labels:
        - bug
        - fix
        - bugfix
    - title: "## 性能优化"
      labels:
        - performance
        - perf
    - title: "## 文档"
      labels:
        - documentation
        - docs
    - title: "## 其他变更"
      labels:
        - "*"
